# Publica las imágenes de los servicios en GHCR y despliega en Coolify cuando
# cambia main. La app móvil tiene su propio workflow (mobile.yml): un cambio solo
# en apps/mobile no llega aquí. Guía completa: docs/DESPLIEGUE.md
#
#   verificar → desplegar (webhook de Coolify) → comprobar
#
# Las 5 imágenes las publica CI en main (job `publicar` de ci.yml) con el SHA como etiqueta.
#
# Configuración:
#   Variables del REPOSITORIO (Settings → Secrets and variables → Actions → Variables):
#     DEPLOY_ENABLED=true, y LANDING_IOS_URL / LANDING_ANDROID_URL (enlaces de las tiendas, opcionales)
#     y LANDING_LEGAL_NAME / LANDING_LEGAL_ADDRESS / LANDING_PRIVACY_EMAIL (responsable en /privacidad).
#     Deben ser del repositorio: las del entorno no se ven en los `if:` ni en la matriz.
#   Entorno `production` (Settings → Environments):
#     variable SITE_URL=https://tu-dominio
#     secretos COOLIFY_WEBHOOK y COOLIFY_TOKEN (los guarda el playbook cliente-alta de infra)
# Sin DEPLOY_ENABLED=true el workflow solo verifica.
name: Desplegar

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:


concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verificar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    name: Verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Exigir CI del SHA exacto en main
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/verify-release.mjs
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Tipos, build y pruebas ya pasaron en el CI de este SHA (lo exige verify-release.mjs)
      - run: npm ci --no-audit --no-fund
      - name: Validar fase de coordinación móvil
        env:
          MOBILE_ROLLOUT_PHASE: ${{ vars.MOBILE_ROLLOUT_PHASE || 'bridge' }}
          MOBILE_MIN_VERSION: ${{ vars.MOBILE_MIN_VERSION || '1.0.0' }}
          MOBILE_RELEASE_READY_VERSION: ${{ vars.MOBILE_RELEASE_READY_VERSION }}
        run: npm run release:check -- --static


      # Los cambios que rompen a las apps publicadas no se despliegan solos: hay que
      # publicar antes la app nueva y subir MOBILE_MIN_VERSION (docs/COMPATIBILIDAD.md).
      # Una vez coordinado, se lanza a mano con "Run workflow".
      - name: Solo cambios sin riesgo alto
        if: github.event_name == 'workflow_run'
        env:
          BEFORE: ${{ github.event.workflow_run.head_sha }}^
        run: |
          node scripts/impact.mjs "$BEFORE" | tee -a "$GITHUB_STEP_SUMMARY"
          level=$(node scripts/impact.mjs "$BEFORE" --json | jq -r .level)
          if [ "$level" = "alto" ]; then
            echo "::error::Este cambio necesita coordinarse con la app móvil. Despliega a mano cuando esté listo."
            exit 1
          fi

  desplegar:
    name: Desplegar en Coolify
    needs: verificar
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verificar.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Exigir las imágenes del SHA
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.verificar.outputs.sha }}
        run: |
          for name in backend frontend dashboard landing gateway; do
            image="ghcr.io/${REPOSITORY,,}-$name:$RELEASE_SHA"
            if ! docker buildx imagetools inspect "$image" > /dev/null; then
              echo "::error::Falta $image. Vuelve a ejecutar el CI de este SHA en main para publicarla."
              exit 1
            fi
          done

      - name: Comprobar disponibilidad antes del corte
        if: vars.MOBILE_ROLLOUT_PHASE == 'enforced'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          MOBILE_ROLLOUT_PHASE: ${{ vars.MOBILE_ROLLOUT_PHASE }}
          MOBILE_MIN_VERSION: ${{ vars.MOBILE_MIN_VERSION }}
          MOBILE_RELEASE_READY_VERSION: ${{ vars.MOBILE_RELEASE_READY_VERSION }}
        run: node scripts/mobile-rollout.mjs --before

      # Mientras la app no exista en Coolify (sin secretos) se publican las imágenes
      # pero no se despliega: el job avisa y termina sin error.
      - name: ¿Coolify está configurado?
        id: coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$COOLIFY_WEBHOOK" ] && [ -n "$COOLIFY_TOKEN" ] && [ -n "$SITE_URL" ]; then
            echo "listo=true" >> "$GITHUB_OUTPUT"
          else
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Imágenes publicadas, pero no se despliega: faltan COOLIFY_WEBHOOK, COOLIFY_TOKEN o SITE_URL en el entorno production (docs/DESPLIEGUE.md §5)."
          fi

      - name: Fijar imágenes al SHA aprobado
        if: steps.coolify.outputs.listo == 'true'
        env:
          RELEASE_SHA: ${{ needs.verificar.outputs.sha }}
          RELEASE_SSH_KEY: ${{ secrets.COOLIFY_RELEASE_SSH_KEY }}
          RELEASE_SSH_HOST_KEY: ${{ secrets.COOLIFY_RELEASE_HOST_KEY }}
          RELEASE_SSH_HOST: ${{ vars.COOLIFY_RELEASE_HOST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/verify-release.mjs
          test -n "$RELEASE_SSH_KEY" && test -n "$RELEASE_SSH_HOST_KEY" && test -n "$RELEASE_SSH_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$RELEASE_SSH_KEY" > ~/.ssh/release_key
          chmod 600 ~/.ssh/release_key
          printf '%s\n' "$RELEASE_SSH_HOST_KEY" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/release_key "root@$RELEASE_SSH_HOST" "release $RELEASE_SHA"
          rm ~/.ssh/release_key

      - name: Pedir el despliegue a Coolify
        if: steps.coolify.outputs.listo == 'true'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          # Coolify (4.3.x) solo despliega con POST
          curl --fail-with-body --silent --show-error --retry 3 --max-time 60 \
            --request POST --header "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"

      # Cada redespliegue corta el sitio ~1 minuto (Coolify para y arranca los
      # contenedores): se espera a que /version.json sirva el commit nuevo.
      - name: Comprobar que la versión nueva ya sirve
        if: steps.coolify.outputs.listo == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          EXPECTED_SHA: ${{ needs.verificar.outputs.sha }}
        run: |
          test -n "$SITE_URL"
          for attempt in $(seq 1 200); do
            revision=$(curl --fail --silent --max-time 10 "$SITE_URL/version.json" | jq -r '.revision' || true)
            if [ "$revision" = "$EXPECTED_SHA" ]; then
              curl --fail --silent --show-error --max-time 15 "$SITE_URL/api/health"
              echo
              echo "Desplegado: $EXPECTED_SHA"
              exit 0
            fi
            if [ "$attempt" -eq 200 ]; then
              echo "::error::Coolify no sirvió la revisión esperada en 10 minutos."
              exit 1
            fi
            sleep 3
          done

      - name: Comprobar coordinación efectiva del servidor
        if: steps.coolify.outputs.listo == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          MOBILE_ROLLOUT_PHASE: ${{ vars.MOBILE_ROLLOUT_PHASE || 'bridge' }}
          MOBILE_MIN_VERSION: ${{ vars.MOBILE_MIN_VERSION || '1.0.0' }}
          MOBILE_RELEASE_READY_VERSION: ${{ vars.MOBILE_RELEASE_READY_VERSION }}
        run: node scripts/mobile-rollout.mjs
