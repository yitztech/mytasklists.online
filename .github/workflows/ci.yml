# Se ejecuta en cada PR y en cada push a main. No despliega nada: dice qué impacto
# tiene el cambio, bloquea lo que rompe a las apps publicadas y corre las pruebas.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  impact:
    name: Impacto y contrato
    runs-on: ubuntu-latest
    env:
      # En un PR se compara con la rama destino; en main, con el commit anterior
      BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Informe de impacto
        run: node scripts/impact.mjs "$BASE" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: El contrato no rompe a las apps publicadas
        run: node scripts/contract-check.mjs "$BASE"

  build:
    name: Tipos y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix apps/mobile --no-audit --no-fund
      - name: Cobertura de idiomas y nuevos textos de interfaz
        run: npm run i18n:check && npm run test:i18n
      # Backend, web, panel y app móvil contra el mismo contrato
      - run: npm run typecheck
      - run: npm run build --workspaces --if-present
      - name: Pruebas backend y frontend
        run: npm run test:backend && npm run test:frontend
      - name: Seguridad Google y compatibilidad de idiomas
        run: node --test scripts/test-google-auth.cjs scripts/test-backend-locales.mjs

  dependencies:
    name: Seguridad de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix apps/mobile --no-audit --no-fund
      - run: node scripts/audit-dependencies.mjs

  e2e-shards:
    name: Shard ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Cache de navegadores Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cache bundle web de app móvil
        uses: actions/cache@v4
        with:
          path: apps/mobile/dist
          key: mobile-dist-${{ runner.os }}-${{ hashFiles('apps/mobile/**', 'packages/**') }}

      - name: Levantar la pila
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          cp .env.example .env
          docker compose up -d --build --wait

      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix apps/mobile --no-audit --no-fund

      - name: Instalar navegadores Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm run install:browsers --workspace @lista/e2e

      - name: Ejecutar pruebas e2e (shard ${{ matrix.shard }})
        run: npm run test:e2e -- --shard=${{ matrix.shard }}

      - name: Logs de la pila
        if: failure()
        run: docker compose logs --no-color > compose-${{ strategy.job-index }}.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-evidencia-shard-${{ strategy.job-index }}
          path: |
            e2e/playwright-report
            e2e/evidence
            compose-*.log
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Pruebas e2e
    needs: [build, e2e-shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Validar todos los shards de pruebas e2e
        run: |
          if [ "${{ needs.e2e-shards.result }}" != "success" ]; then
            echo "::error::Uno o más shards de pruebas e2e fallaron (${{ needs.e2e-shards.result }})."
            exit 1
          fi
          echo "✅ Todos los shards de pruebas e2e pasaron exitosamente."
