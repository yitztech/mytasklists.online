# Se ejecuta en cada PR y en cada push a main. No despliega nada: dice qué impacto
# tiene el cambio, bloquea lo que rompe a las apps publicadas y corre las pruebas.
# En main publica además las imágenes del SHA, que despliega deploy.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  impact:
    name: Impacto y contrato
    runs-on: ubuntu-latest
    env:
      # En un PR se compara con la rama destino; en main, con el commit anterior
      BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Informe de impacto
        run: node scripts/impact.mjs "$BASE" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: El contrato no rompe a las apps publicadas
        run: node scripts/contract-check.mjs "$BASE"

  build:
    name: Tipos y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix apps/mobile --no-audit --no-fund
      - name: Cobertura de idiomas y nuevos textos de interfaz
        run: npm run i18n:check && npm run test:i18n
      # Backend, web, panel y app móvil contra el mismo contrato
      - run: npm run typecheck
      - run: npm run build --workspaces --if-present
      - name: Pruebas backend y frontend
        run: npm run test:backend && npm run test:frontend
      - name: Seguridad Google y compatibilidad de idiomas
        run: node --test scripts/test-google-auth.cjs scripts/test-backend-locales.mjs

  dependencies:
    name: Seguridad de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix apps/mobile --no-audit --no-fund
      - run: node scripts/audit-dependencies.mjs

  # No espera al job de build: la pila se construye aquí y los shards arrancan a la
  # vez que él. La app móvil no se prueba en CI (solo en local, a pedido).
  e2e-shards:
    name: Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache de navegadores Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - uses: docker/setup-buildx-action@v4
      # Expone el token de la caché de GitHub a buildx (type=gha)
      - uses: crazy-max/ghaction-github-runtime@v4

      # La pila se construye en segundo plano mientras se instalan las dependencias.
      # Las imágenes salen de la caché de capas; solo el shard 1 la actualiza.
      - name: Construir y levantar la pila
        env:
          WRITE_CACHE: ${{ matrix.shard == '1/4' }}
        run: |
          cp .env.example .env
          project=$(docker compose config --format json | jq -r .name)
          args=()
          for svc in $(docker compose config --format json | jq -r '.services | to_entries[] | select(.value.build) | .key'); do
            args+=(--set "$svc.tags=$project-$svc" --set "$svc.cache-from=type=gha,scope=e2e-$svc")
            if [ "$WRITE_CACHE" = true ]; then args+=(--set "$svc.cache-to=type=gha,mode=max,scope=e2e-$svc"); fi
          done
          ({ docker buildx bake -f docker-compose.yml --load "${args[@]}" && docker compose up -d --wait; } > compose-up.log 2>&1; echo $? > compose-up.exit) &

      - run: npm ci --no-audit --no-fund

      - name: Instalar navegadores Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm run install:browsers --workspace @lista/e2e

      - name: Esperar la pila
        run: |
          for attempt in $(seq 1 300); do
            [ -f compose-up.exit ] && break
            sleep 2
          done
          cat compose-up.log
          test "$(cat compose-up.exit 2>/dev/null)" = 0

      - name: Pruebas e2e (shard ${{ matrix.shard }})
        run: npx --workspace @lista/e2e playwright test --grep-invert @aislado --shard=${{ matrix.shard }}

      # Pruebas que detienen servicios compartidos: al final, en serie y en un solo shard
      - name: Pruebas aisladas
        if: matrix.shard == '1/4'
        run: npm run test:isolated --workspace @lista/e2e

      - name: Logs de la pila
        if: failure()
        run: docker compose logs --no-color > compose-${{ strategy.job-index }}.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-evidencia-shard-${{ strategy.job-index }}
          path: |
            e2e/playwright-report
            e2e/evidence
            compose-*.log
            compose-up.log
          if-no-files-found: ignore
          retention-days: 7

  # Imágenes de producción del SHA, en paralelo con las pruebas. Publicarlas antes de
  # que CI termine no las despliega: verify-release.mjs y el comando de release del
  # servidor exigen CI aprobado del SHA exacto antes de fijar IMAGE_TAG.
  publicar:
    name: Publicar ${{ matrix.name }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          # KEEP_SEED=false: la imagen de producción no lleva datos de demostración
          - name: backend
            file: apps/backend/Dockerfile
            context: .
            target: runtime
            build_args: |
              KEEP_SEED=false
          - name: frontend
            file: apps/frontend/Dockerfile
            context: .
            build_args: |
              VITE_API_URL=/api
              VITE_SOCKET_URL=/
          - name: dashboard
            file: apps/dashboard/Dockerfile
            context: .
            build_args: |
              VITE_API_URL=/api
          - name: landing
            file: apps/landing/Dockerfile
            context: apps/landing
            build_args: |
              LANDING_PUBLIC_URL=${{ vars.LANDING_PUBLIC_URL || 'https://mytasklists.online' }}
              LANDING_NOINDEX=${{ vars.LANDING_NOINDEX || 'false' }}
              LANDING_IOS_URL=${{ vars.LANDING_IOS_URL || '#descargar' }}
              LANDING_ANDROID_URL=${{ vars.LANDING_ANDROID_URL || '#descargar' }}
              LANDING_LEGAL_NAME=${{ vars.LANDING_LEGAL_NAME }}
              LANDING_LEGAL_ADDRESS=${{ vars.LANDING_LEGAL_ADDRESS }}
              LANDING_PRIVACY_EMAIL=${{ vars.LANDING_PRIVACY_EMAIL }}
          - name: gateway
            file: infra/nginx/gateway/Dockerfile
            context: .
            build_args: |
              RELEASE_SHA=${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR exige minúsculas en el nombre de la imagen
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true

  e2e:
    name: Pruebas e2e
    needs: [build, e2e-shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Validar todos los shards de pruebas e2e
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Tipos y build fallaron (${{ needs.build.result }})."
            exit 1
          fi
          if [ "${{ needs.e2e-shards.result }}" != "success" ]; then
            echo "::error::Uno o más shards de pruebas e2e fallaron (${{ needs.e2e-shards.result }})."
            exit 1
          fi
          echo "✅ Todos los shards de pruebas e2e pasaron exitosamente."
