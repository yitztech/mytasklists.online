server {
    listen 80;
    # Sin la versión de nginx en las cabeceras ni en las páginas de error (ZAP 10009)
    server_tokens off;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Detrás del gateway y de Traefik nginx ve http: la redirección de /precios a /precios/ saldría
    # con http:// y daría dos saltos. Relativas, el navegador conserva https (AGENTS.md §9.2).
    absolute_redirect off;

    # Una sola forma por URL: /precios/index.html → /precios/ y /privacidad.html → /privacidad. Se mira
    # $request_uri (lo que pidió el navegador), no $uri, que cambia al servir el index de un directorio.
    if ($request_uri ~ "^(?<idx_dir>/(?:[^?]*/)?)index\.html(?<idx_qs>\?.*)?$") { return 301 $idx_dir$idx_qs; }
    if ($request_uri ~ "^(?<html_base>/[^?]+)\.html(?<html_qs>\?.*)?$") { return 301 $html_base$html_qs; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location /downloads/ {
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
