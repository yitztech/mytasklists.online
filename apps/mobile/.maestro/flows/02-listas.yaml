appId: online.mytasklists.app
name: Listas · crear una lista, agregar un producto y comprarlo
---
- runFlow: ../subflows/abrir-sin-sesion.yaml
- runFlow: ../subflows/iniciar-sesion.yaml

- tapOn:
    id: new-list-button
- tapOn:
    id: new-list-name
- inputText: Super del domingo
- hideKeyboard
- tapOn:
    id: new-list-submit
- extendedWaitUntil:
    visible: Super del domingo
    timeout: 10000

- tapOn: Super del domingo
- extendedWaitUntil:
    visible:
      id: list-detail-screen
    timeout: 20000

- tapOn:
    id: item-name-input
- inputText: Pilas AA
- hideKeyboard
- tapOn:
    id: add-item-button
# El formulario ocupa casi toda la pantalla: el producto queda debajo
- scrollUntilVisible:
    element:
      id: pending-item
    direction: DOWN
    timeout: 10000
- assertVisible: Pilas AA
- takeScreenshot: listas-producto-pendiente

# Tocar el producto lo marca como comprado y baja a la lista de comprados
- tapOn:
    id: item-checkbox
# En un emulador lento el toque puede llegar como pulsación larga, que abre el menú del producto
- runFlow:
    when:
      visible: ¿Qué quieres hacer\?
    commands:
      - tapOn: (?i)cancelar
      - tapOn:
          id: item-checkbox
- scrollUntilVisible:
    element:
      id: purchased-item
    direction: DOWN
    timeout: 30000
- assertNotVisible:
    id: pending-item
- takeScreenshot: listas-producto-comprado
