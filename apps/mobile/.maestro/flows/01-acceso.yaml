appId: online.mytasklists.app
name: Acceso · credenciales inválidas e inicio de sesión
---
- runFlow: ../subflows/abrir-sin-sesion.yaml

# Con la contraseña equivocada se queda en el login y lo explica
- tapOn:
    id: login-email
- inputText: ${EMAIL}
# Intro pasa a la contraseña y después envía: el teclado tapa esos campos en pantallas pequeñas
- pressKey: Enter
- inputText: ClaveEquivocada99
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: login-error
    timeout: 10000
- assertNotVisible:
    id: lists-screen

# Con la correcta entra a sus listas
- runFlow: ../subflows/abrir-sin-sesion.yaml
- runFlow: ../subflows/iniciar-sesion.yaml
- takeScreenshot: acceso-mis-listas
