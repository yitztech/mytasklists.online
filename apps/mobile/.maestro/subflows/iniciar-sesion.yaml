# Entra con la cuenta que crea scripts/mobile-test.mjs (EMAIL y PASSWORD)
appId: online.mytasklists.app
---
- tapOn:
    id: login-email
- inputText: ${EMAIL}
# Intro pasa a la contraseña y después envía: el teclado tapa esos campos en pantallas pequeñas
- pressKey: Enter
- inputText: ${PASSWORD}
- pressKey: Enter
- runFlow:
    when:
      platform: iOS
    # iOS ofrece guardar la contraseña en un diálogo del sistema que tapa la app
    commands:
      - tapOn:
          text: Ahora no|Not Now
          optional: true
- extendedWaitUntil:
    visible:
      id: lists-screen
    timeout: 20000
