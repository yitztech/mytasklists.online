# Respuestas que no son páginas (API, WebSocket): fuera del buscador con la cabecera, nunca con
# Disallow en robots.txt (AGENTS.md §9.2). Un add_header en una location anula los del server, así que
# se repite aquí el HSTS que el server pone a todo.
add_header X-Robots-Tag "noindex" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
